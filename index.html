<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Invitation</title>

<style>

body{
margin:0;
padding:0;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fad0c4);
}

.card{

width:500px;
background:white;
padding:40px;
border-radius:20px;
text-align:center;
box-shadow:0px 0px 20px gray;

}

h1{

color:#e91e63;

}

p{

font-size:20px;
line-height:35px;

}

button{

padding:15px 35px;
font-size:20px;
background:#ff4081;
color:white;
border:none;
border-radius:10px;
cursor:pointer;

}

button:hover{

background:#d81b60;

}

</style>

</head>

<body>

<div class="card">

<h1>💌 Friendship Day Invitation 💌</h1>

<p>

Hi ❤️

I have prepared a small surprise especially for you.

Click the button below to open your Friendship Day surprise.

</p>

<button onclick="openWish()">

Open Invitation ❤️

</button>

</div>

<script>

function openWish(){

window.location.href="wish.html";

}

</script>

</body>

</html>
